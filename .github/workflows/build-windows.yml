name: Build Windows Installer

on:
  push:
    branches: [ main, 'cursor/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-pinned.txt
    
    - name: Run tests
      run: |
        pytest tests/ -v --tb=short
    
    - name: Build executable with PyInstaller
      run: |
        python -m PyInstaller ciscoman.spec
    
    - name: Build installer with Inno Setup
      run: |
        # Download and install Inno Setup
        $innoUrl = "https://jrsoftware.org/download.php/is.exe"
        $innoPath = "$env:TEMP\innosetup.exe"
        Invoke-WebRequest -Uri $innoUrl -OutFile $innoPath
        Start-Process -FilePath $innoPath -ArgumentList "/VERYSILENT /NORESTART /DIR=C:\InnoSetup" -Wait
        
        # Compile installer
        & "C:\InnoSetup\ISCC.exe" installer\ciscoman-setup.iss
      shell: powershell
    
    - name: Upload executable
      uses: actions/upload-artifact@v4
      with:
        name: ciscoman-windows-exe
        path: dist/CiscoMan/
        retention-days: 30
    
    - name: Upload installer
      uses: actions/upload-artifact@v4
      with:
        name: ciscoman-windows-installer
        path: installer/Output/*.exe
        retention-days: 90
