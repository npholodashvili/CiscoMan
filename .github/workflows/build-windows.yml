name: Build Windows Installer

on:
  push:
    branches: [ main, 'cursor/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-pinned.txt
    
    - name: Run tests
      run: |
        pytest tests/ -v --tb=short
    
    - name: Build executable with PyInstaller
      run: |
        python -m PyInstaller ciscoman.spec
    
    - name: Install Inno Setup via Chocolatey
      run: |
        choco install innosetup -y
      shell: powershell
    
    - name: Build installer with Inno Setup
      run: |
        Write-Host "Building installer..."
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\ciscoman-setup.iss
      shell: powershell
    
    - name: Upload executable
      uses: actions/upload-artifact@v4
      with:
        name: ciscoman-windows-exe
        path: dist/CiscoMan/
        retention-days: 30
    
    - name: Upload installer
      uses: actions/upload-artifact@v4
      with:
        name: ciscoman-windows-installer
        path: installer/Output/*.exe
        retention-days: 90
